<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Cloud-9</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&display=swap" rel="stylesheet"> -->
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon.ico">

  </head>
  <body>
    <h1 id="app-title">cloud 9</h1>
    <div id="mainapp">
          <div class="card">
            <div class="search">
              <input type="text" id="search-input" placeholder="Enter city name" spellcheck="false">
              <button><img src="icons/download__15_-removebg-preview.png" alt="search" id="search-icon"></button>
            </div>
        <div class="weather">
          <img src="icons/rain.png" alt="rain" class="weather-icon">
          <h1 class="temp">22°C</h1>
          <h2 class="city">New York</h2>
          <div class="details">
            <div class="col">
              <img src="icons/humidity.png" alt="humidity">
              <div>
                <p class="humidity">50%</p>
                <p class="detail-weather">Humidity</p>
              </div>
            </div>
             <div class="col">
              <img src="icons/wind.png" alt="wind">
              <div>
                <p class="wind">11 km/h</p>
                <p class="detail-weather">Wind Speed</p>
              </div>
            </div>
          </div>
        </div>
          </div>
   </div>
<!-- <img src="icons/non sparkle night.png" alt="night" id="bg-night"> -->
    <script src="/js/neutralino.js"></script>

    <!-- Your app's source files -->
    <script src="/js/main.js"></script>
    <script src="js/main.js"></script>

  </body>
</html>
